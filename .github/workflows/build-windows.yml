name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (skip PyPI tk)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # tkinter is bundled with Windows Python; PyPI package `tk` is useless / can fail
          Get-Content requirements.txt |
            Where-Object { $_ -notmatch '^\s*tk(\s|#|$)' } |
            Set-Content requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Build with PyInstaller
        shell: pwsh
        run: python build.py

      - name: Zip ARAMHelper folder
        shell: pwsh
        run: |
          $buildDir = Get-ChildItem -Path dist -Directory -Filter "build_*" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $buildDir) {
            throw "No dist/build_* directory found"
          }
          $aramHelper = Join-Path $buildDir.FullName "ARAMHelper"
          if (-not (Test-Path $aramHelper)) {
            throw "ARAMHelper folder not found under $($buildDir.FullName)"
          }
          Write-Host "Zipping: $aramHelper"
          if (Test-Path xiaobai-helper-windows.zip) { Remove-Item xiaobai-helper-windows.zip -Force }
          Compress-Archive -Path $aramHelper -DestinationPath xiaobai-helper-windows.zip
          Get-Item xiaobai-helper-windows.zip | Format-List FullName, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaobai-helper-windows
          path: xiaobai-helper-windows.zip
          retention-days: 14

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xiaobai-helper-windows.zip
          generate_release_notes: true
