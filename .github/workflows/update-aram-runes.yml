name: Update ARAM Runes

on:
  schedule:
    # Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch rune build inputs
        run: bash scripts/ci_fetch_rune_inputs.sh

      - name: Regenerate data/aram_runes.json
        env:
          ARAM_ROOT: ${{ github.workspace }}
          ARAM_UGG_DIR: ${{ github.workspace }}/.cache/ugg-aram/package
          ARAM_DDRAGON_CHAMP: ${{ github.workspace }}/.cache/champion_en.json
          ARAM_PERKSTYLES: ${{ github.workspace }}/.cache/perkstyles.json
        run: python scripts/build_aram_runes.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aram_runes.json
          if git diff --staged --quiet; then
            echo "No changes to data/aram_runes.json"
            exit 0
          fi
          git commit -m "chore: weekly refresh data/aram_runes.json [bot]"
          git push origin HEAD:main
